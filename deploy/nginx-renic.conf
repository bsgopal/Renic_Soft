# ==============================================================================
# RENIC ECOSYSTEM - HOSTINGER VPS NGINX REVERSE PROXY CONFIGURATION
# Location on VPS: /etc/nginx/sites-available/renic-ecosystem.conf
# ==============================================================================

# Redirect all HTTP (Port 80) traffic to HTTPS (Port 443)
server {
    listen 80;
    listen [::]:80;
    server_name renic.store *.renic.store;
    return 301 https://$host$request_uri;
}

# ------------------------------------------------------------------------------
# 1. CENTRAL MASTER HEADQUARTERS: hq.renic.store (Renic_Soft Port 5050)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hq.renic.store;

    # Cloudflare Origin Certificate (Free 15-Year SSL)
    ssl_certificate /etc/ssl/certs/renic_wildcard.pem;
    ssl_certificate_key /etc/ssl/private/renic_wildcard.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:5050;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# ------------------------------------------------------------------------------
# 2. CLIENT MULTI-TENANT AUTOMATION: *.renic.store (WA_INSTA_AUTOMATION Port 5000)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    
    # Matches any client subdomain (e.g. royaljewelers.renic.store, malabar.renic.store)
    server_name ~^(?<subdomain>[a-zA-Z0-9_-]+)\.renic\.store$;

    ssl_certificate /etc/ssl/certs/renic_wildcard.pem;
    ssl_certificate_key /etc/ssl/private/renic_wildcard.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 100M;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Subdomain $subdomain;  # Passes customer slug to Node.js!
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # WebSocket support for Live WhatsApp chat streaming
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
